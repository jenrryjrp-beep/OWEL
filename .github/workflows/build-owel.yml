name: Build OWEL portable (Windows)

# Cloud build for OWEL's single-file Windows executable: no local toolchain
# needed. Every push to main (and every v* tag) packages the electron-builder
# "portable" target and uploads release/OWEL-<version>-portable.exe as an
# artifact; a v* tag additionally attaches it to that GitHub Release.
#
# The xlsx sidecar is built with the host MSVC toolchain (statically linked
# CRT, see apps/sheets/native/xlsx-engine/.cargo/config.toml) and then copied to
# the MinGW cross-build path that apps/shell/electron-builder.cjs expects, so
# no MinGW installation is required.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-owel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07
        with:
          toolchain: stable

      - name: Cache cargo (xlsx sidecar)
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: apps/sheets/native/xlsx-engine

      - name: Install dependencies
        run: npm ci

      - name: Build xlsx sidecar
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release \
            --manifest-path apps/sheets/native/xlsx-engine/Cargo.toml \
            --config apps/sheets/native/xlsx-engine/.cargo/config.toml
          # electron-builder reads the MinGW cross-build output path; on a
          # Windows host cargo writes target/release instead.
          mkdir -p apps/sheets/native/xlsx-engine/target/x86_64-pc-windows-gnu/release
          cp apps/sheets/native/xlsx-engine/target/release/xlsx-sidecar.exe \
            apps/sheets/native/xlsx-engine/target/x86_64-pc-windows-gnu/release/xlsx-sidecar.exe

      - name: Build portable exe
        # Unsigned build: signing needs the operator's certificate in Secrets.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win

      - name: Upload portable exe artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OWEL-portable-windows-x64
          path: apps/shell/release/OWEL-*-portable.exe
          if-no-files-found: error
          retention-days: 30

      - name: Attach portable exe to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(apps/shell/release/OWEL-*-portable.exe)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no portable exe found under apps/shell/release" >&2
            exit 1
          fi
          exe="${files[0]}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$exe" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$exe" \
              --title "OWEL $GITHUB_REF_NAME" --generate-notes
          fi
